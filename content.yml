# ============================================================
#  All site content lives here.  Edit this file, refresh — done.
#
#  Format: YAML. Prose fields ("paragraphs", "intro") accept
#  Markdown — links written as [Tsinghua](https://...) render
#  correctly. Everything else is a plain string.
#
#  The author's own name (see `me` below) is auto-highlighted
#  wherever it appears in an `authors:` line.
# ============================================================

me: Bingda Tang        # auto-bold in author lists

site:
  brand: 'Bingda Tang「湯秉達」'
  brand_href: /
  nav:
    - { label: Home,     href: /,                   match: ['', index.html] }
    - { label: Research, href: /publications.html,  match: publications.html }
    - { label: Travel,   href: /travel.html,       match: travel.html }
    - { label: CV,       href: /assets/pdf/CV.pdf }
    - { label: Contact,  href: 'mailto:tangbd2003@gmail.com' }

# ---------------------- ABOUT (home page) ----------------------

about:
  photo: /assets/img/photo.jpg
  paragraphs:
    - >
      Hi there! I am Bingda Tang, an
      incoming PhD student at the [University of California, Berkeley](https://www.berkeley.edu/).
    - >
      I work on continual learning, multimodal learning, and generative modeling.
    - >
      I did my undergraduate studies at [Tsinghua University](https://www.tsinghua.edu.cn/), and I am fortunate to have worked with
      [Serena Yeung-Levy](https://marvl.stanford.edu/),
      [Saining Xie](https://www.sainingxie.com/), and
      [Ting Chen](http://timlab.cn/author/ting-chen/).

